/* =====================================================================
   2. CORES — somente a paleta oficial Crescimentum
   Para ajustar a aparência, troque entre os tons da paleta aqui.
===================================================================== */
:root {
  --cr-espresso: #210000;
  --cr-branco: #FFFFFF;
  --cr-laranja-escuro: #733909;
  --cr-laranja-medio: #FF5527;
  --cr-laranja-claro: #FFC7AE;
  --cr-teal-escuro: #004641;
  --cr-teal-medio: #009EAA;
  --cr-teal-claro: #A1EAE6;

  --cr-fonte-titulo: 'Ryker', 'Raleway', Arial, sans-serif;
  --cr-fonte-texto: 'Raleway', Arial, sans-serif;

  /* Bordas sutis: espresso com transparência (permitido pela marca) */
  --borda: rgba(33, 0, 0, .14);
  --borda-forte: rgba(33, 0, 0, .35);
}

/* Temas por momento da experiência (a troca de composição acontece aqui) */
body.tema-claro  { --bg: var(--cr-branco);        --fg: var(--cr-espresso); --eyebrow: var(--cr-laranja-escuro); --linha: var(--cr-laranja-claro); --borda-ui: var(--borda-forte); --trilho: rgba(33,0,0,.14); }
body.tema-laranja{ --bg: var(--cr-laranja-claro); --fg: var(--cr-espresso); --eyebrow: var(--cr-espresso);       --linha: var(--cr-laranja-medio); --borda-ui: rgba(33,0,0,.45);   --trilho: rgba(33,0,0,.18); }
body.tema-escuro { --bg: var(--cr-espresso);      --fg: var(--cr-branco);   --eyebrow: var(--cr-laranja-claro);  --linha: var(--cr-laranja-medio); --borda-ui: rgba(255,255,255,.45); --trilho: rgba(255,255,255,.22); }

/* =====================================================================
   3. BASE
===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--cr-fonte-texto);
  font-size: 18px;
  line-height: 1.5;
  transition: background-color .6s ease, color .6s ease;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

:focus-visible { outline: 3px solid var(--cr-teal-escuro); outline-offset: 3px; border-radius: 6px; }
body.tema-escuro :focus-visible { outline-color: var(--cr-laranja-claro); }
[data-foco]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =====================================================================
   4. ESTRUTURA: topo, palco, linha de referência
===================================================================== */
.app { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

.topo {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 24px clamp(20px, 4vw, 48px) 0;
}
.logo { display: block; width: 200px; height: auto; }          /* mínimo da marca no digital: 190 px */
.logo-br { display: none; }
body.tema-escuro .logo-esp { display: none; }
body.tema-escuro .logo-br  { display: block; }

.btn-fac {
  min-height: 40px; padding: 8px 16px;
  background: transparent; color: var(--fg);
  border: 1.5px solid var(--borda-ui); border-radius: 999px;
  font-size: 13px; font-weight: 700; letter-spacing: .04em; cursor: pointer;
  transition: background-color .2s, color .2s;
}
.btn-fac:hover { background: var(--fg); color: var(--bg); }

.palco {
  flex: 1; width: 100%; max-width: 780px; margin: 0 auto;
  padding: clamp(16px, 3vh, 32px) clamp(20px, 4vw, 48px) clamp(28px, 5vh, 56px);
  display: flex; flex-direction: column; justify-content: center;
  position: relative; z-index: 2;
}
.tela { display: flex; flex-direction: column; gap: clamp(18px, 3.2vh, 30px); }
.tela.centro { align-items: flex-start; }

/* Linha de referência oficial: uma por tela, sangrando uma borda */
.linha {
  position: fixed; z-index: 0; pointer-events: none; height: auto;
  color: var(--linha); overflow: visible;
}
.linha path { stroke-dasharray: 1; stroke-dashoffset: 0; animation: desenhar 2.4s cubic-bezier(.45,.1,.2,1) both; }
@keyframes desenhar { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

.l-abertura { right: -3%;  bottom: -5%; width: clamp(190px, 34vw, 440px); color: var(--cr-laranja-medio); }
.l-instrucao{ right: -7%;  top: 14%;    width: clamp(220px, 40vw, 520px); }
.l-troca    { right: -4%;  bottom: -14%; width: clamp(220px, 38vw, 480px); }
.l-plenaria { left: -6%;   bottom: -6%; width: clamp(220px, 36vw, 460px); }
.l-fecha    { right: -9%;  bottom: -12%; width: clamp(200px, 38vw, 480px); }
@media (max-width: 700px) {
  .l-abertura { color: var(--cr-laranja-claro); bottom: -3%; }
}

/* =====================================================================
   5. TIPOGRAFIA E COMPONENTES
===================================================================== */
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--eyebrow); }
.titulo-xl { font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: clamp(46px, 11.5vw, 88px); line-height: 1.02; letter-spacing: -.02em; }
.titulo-l  { font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: clamp(34px, 8vw, 56px);  line-height: 1.06; letter-spacing: -.015em; }
.titulo-m  { font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: clamp(28px, 6vw, 40px);  line-height: 1.12; letter-spacing: -.01em; }
.sub       { font-family: var(--cr-fonte-titulo); font-weight: 500; font-size: clamp(20px, 4.6vw, 28px); line-height: 1.25; }
.texto     { font-size: clamp(17px, 3.6vw, 20px); max-width: 34em; }
.texto-p   { font-size: 15px; max-width: 34em; opacity: .85; }
body.tema-escuro .texto-p { opacity: .9; }

.selo {
  display: inline-flex; align-self: flex-start; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 999px;
  background: var(--cr-laranja-claro); color: var(--cr-espresso);
  font-size: 13px; font-weight: 700; letter-spacing: .06em;
}

.destaque {
  background: var(--cr-laranja-claro); color: var(--cr-espresso);
  border-radius: 20px; padding: clamp(20px, 4.5vw, 32px);
}
.destaque .rotulo { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cr-espresso); }
.destaque .pergunta-destaque { font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: clamp(22px, 5.2vw, 32px); line-height: 1.15; letter-spacing: -.01em; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 58px; padding: 16px 32px; border: 2px solid var(--cr-laranja-medio); border-radius: 999px;
  background: var(--cr-laranja-medio); color: var(--cr-espresso);
  font-family: var(--cr-fonte-texto); font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer; text-align: center;
  transition: background-color .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
}
.btn:hover { background: var(--cr-espresso); border-color: var(--cr-espresso); color: var(--cr-branco); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
body.tema-escuro .btn:hover { background: var(--cr-laranja-claro); border-color: var(--cr-laranja-claro); color: var(--cr-espresso); }
.btn[disabled] { background: transparent; border-color: var(--borda-ui); color: var(--fg); opacity: .6; cursor: not-allowed; transform: none; }

.btn-sec { background: transparent; border-color: var(--borda-ui); color: var(--fg); }
.btn-sec:hover { background: var(--cr-laranja-claro); border-color: var(--cr-laranja-claro); color: var(--cr-espresso); }
body.tema-escuro .btn-sec:hover { background: var(--cr-laranja-claro); border-color: var(--cr-laranja-claro); color: var(--cr-espresso); }

.btn-link {
  background: none; border: 0; padding: 10px 4px; min-height: 44px; cursor: pointer;
  font-size: 14px; font-weight: 700; color: var(--fg); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px;
}
.btn-link:hover { text-decoration-color: var(--cr-laranja-medio); text-decoration-thickness: 3px; }

.acoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
@media (max-width: 560px) {
  .acoes { flex-direction: column; align-items: stretch; }
  .acoes .btn { width: 100%; }
}

/* =====================================================================
   6. CARTAS
===================================================================== */
.cabeca-rodada { display: flex; flex-direction: column; gap: 6px; }
.passos-linha { display: flex; align-items: center; gap: 14px; }
.passos { flex: 1; display: flex; gap: 6px; }
.passo { flex: 1; height: 5px; border-radius: 3px; background: var(--trilho); overflow: hidden; }
.passo .f { display: block; height: 100%; background: var(--cr-laranja-medio); transform: scaleX(0); transform-origin: left; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.passo.feito .f { transform: scaleX(1); }
body.tema-laranja .passo .f { background: var(--cr-espresso); }
.contagem { font-size: 14px; font-weight: 700; white-space: nowrap; }

.carta {
  position: relative; display: flex; flex-direction: column; gap: clamp(16px, 3.4vh, 28px);
  min-height: min(40vh, 380px); min-height: min(40dvh, 380px);
  padding: clamp(22px, 5vw, 40px);
  background: var(--cr-branco); color: var(--cr-espresso);
  border: 1.5px solid var(--borda); border-radius: 24px;
  outline: none;
}
.carta-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cat { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--cr-teal-escuro); }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cr-teal-medio); flex: none; }
.num { font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: 26px; line-height: 1; color: var(--cr-laranja-medio); }
.num-coringa { font-size: 12px; font-family: var(--cr-fonte-texto); letter-spacing: .15em; text-transform: uppercase; color: var(--cr-laranja-escuro); }
.comportamento { flex: 1; display: flex; align-items: center; font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: clamp(26px, 6.4vw, 40px); line-height: 1.14; letter-spacing: -.01em; overflow-wrap: anywhere; }
.carta-pergunta { padding-top: 18px; border-top: 1.5px solid var(--borda); font-family: var(--cr-fonte-titulo); font-weight: 500; font-size: clamp(20px, 4.8vw, 27px); line-height: 1.25; }
.lacuna { display: block; height: 1.7em; margin-top: 4px; border-bottom: 2px solid var(--cr-espresso); }

/* Carta inversa */
.carta.inversa { background: var(--cr-espresso); color: var(--cr-branco); border-color: var(--cr-espresso); }
.carta.inversa .cat { color: var(--cr-teal-claro); }
.carta.inversa .cat::before { background: var(--cr-teal-medio); }
.carta.inversa .comportamento { font-size: clamp(26px, 6.2vw, 38px); }
.carta.inversa .btn-link { color: var(--cr-branco); align-self: flex-start; }
.carta.inversa .btn-link:hover { text-decoration-color: var(--cr-laranja-medio); }
.carta.inversa :focus-visible { outline-color: var(--cr-laranja-claro); }

/* Coringa */
.carta.coringa { background: var(--cr-branco); border-color: var(--cr-laranja-medio); border-width: 2px; }
.campo { width: 100%; min-height: 110px; padding: 14px 16px; resize: vertical; background: var(--cr-branco); color: var(--cr-espresso); border: 2px solid var(--borda-forte); border-radius: 14px; font-size: 18px; line-height: 1.4; }
.campo:focus { outline: 3px solid var(--cr-teal-escuro); outline-offset: 2px; border-color: var(--cr-espresso); }
.campo-dica { font-size: 13px; opacity: .8; }

/* Rodapé da carta: cronômetro discreto + carta inversa */
.rodape-carta { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; }
.tempo { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 220px; background: none; border: 0; padding: 8px 0; cursor: pointer; color: var(--fg); }
.tempo-n { font-size: 13px; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; min-width: 2.6em; text-align: left; }
.tempo-trilho { flex: 1; height: 3px; border-radius: 2px; background: var(--trilho); overflow: hidden; }
.tempo-fill { display: block; height: 100%; background: var(--cr-teal-medio); transform-origin: left; transform: scaleX(1); transition: transform .26s linear; }
body.tema-laranja .tempo-fill { background: var(--cr-teal-escuro); }

/* =====================================================================
   7. PLENÁRIA, TROCA, FECHAMENTO
===================================================================== */
.opcoes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: clamp(17px, 3.8vw, 20px); font-weight: 600; }
.opcoes li::before { content: "\2192\00a0"; color: var(--cr-laranja-escuro); font-weight: 700; }
.opcoes li.ou::before { content: ""; }
.opcoes li.ou { font-size: 12px; letter-spacing: .18em; font-weight: 700; padding-left: 1.6em; color: var(--cr-teal-escuro); }
.plen-carta { min-height: 0; }
.plen-carta .carta { min-height: 0; }

/* Troca de dupla: duas duplas, uma pessoa de cada lado muda de lugar */
.troca-anim { position: relative; width: min(100%, 340px); height: 110px; margin: 4px 0 6px; }
.ponto { position: absolute; top: 40px; width: 30px; height: 30px; border-radius: 50%; }
.ponto.a1 { left: 14px;  background: var(--cr-laranja-medio); }
.ponto.a2 { left: 84px;  background: var(--cr-laranja-medio); animation: vai 3.6s ease-in-out infinite alternate; }
.ponto.b1 { left: 226px; background: var(--cr-teal-claro);    animation: volta 3.6s ease-in-out infinite alternate; }
.ponto.b2 { left: 296px; background: var(--cr-teal-claro); }
@keyframes vai   { 0%,12% { transform: translate(0,0); } 30% { transform: translate(40px,-34px); } 50% { transform: translate(71px,-40px); } 70% { transform: translate(102px,-34px); } 88%,100% { transform: translate(142px,0); } }
@keyframes volta { 0%,12% { transform: translate(0,0); } 30% { transform: translate(-40px,34px); } 50% { transform: translate(-71px,40px); } 70% { transform: translate(-102px,34px); } 88%,100% { transform: translate(-142px,0); } }
.troca-msg2 { font-family: var(--cr-fonte-titulo); font-weight: 500; font-size: clamp(22px, 5vw, 30px); color: var(--cr-laranja-claro); }

/* Fechamento: frases em sequência */
.fecha { display: flex; flex-direction: column; gap: clamp(14px, 3vh, 26px); min-height: 40vh; justify-content: center; }
.fecha p { font-family: var(--cr-fonte-titulo); font-weight: 700; line-height: 1.1; letter-spacing: -.015em; }
.f1 { font-size: clamp(30px, 7.4vw, 54px); }
.f2 { font-size: clamp(38px, 10vw, 76px); color: var(--cr-laranja-medio); }
.f3 { font-size: clamp(30px, 7.4vw, 54px); }
.f4 { font-family: var(--cr-fonte-texto) !important; font-weight: 700 !important; font-size: clamp(18px, 4vw, 24px); letter-spacing: 0 !important; color: var(--cr-laranja-claro); line-height: 1.35 !important; }
.assina { margin-top: clamp(8px, 2vh, 20px); font-size: 13px; letter-spacing: .12em; opacity: .85; }

/* =====================================================================
   8. ANIMAÇÕES DE ENTRADA / SAÍDA
===================================================================== */
@keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes surgir { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
.entra > * { animation: subir .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.carta-nova { animation: surgir .55s cubic-bezier(.2,.7,.2,1) both; }
.revela { animation: subir .9s ease both; }
.tela-saindo { opacity: 0; transform: translateY(-6px); transition: opacity .16s ease, transform .16s ease; }

/* =====================================================================
   9. MODO FACILITADOR (visualmente secundário)
===================================================================== */
dialog.fac { --fg: var(--cr-espresso); --bg: var(--cr-branco); --borda-ui: var(--borda-forte); width: min(560px, calc(100% - 28px)); max-height: 88vh; max-height: 88dvh; padding: 0; border: 1.5px solid var(--borda); border-radius: 20px; background: var(--cr-branco); color: var(--cr-espresso); overflow: auto; }
dialog.fac :focus-visible { outline-color: var(--cr-teal-escuro); }
dialog.fac::backdrop { background: rgba(33, 0, 0, .55); }
.fac-in { padding: clamp(20px, 5vw, 32px); display: flex; flex-direction: column; gap: 20px; font-size: 15px; }
.fac-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.fac h2 { font-family: var(--cr-fonte-titulo); font-weight: 700; font-size: 22px; line-height: 1.2; }
.fac h3 { margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cr-teal-escuro); }
.fac-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.fac-meta span { padding: 4px 12px; border-radius: 999px; background: var(--cr-laranja-claro); font-size: 12px; font-weight: 700; }
.roteiro { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.roteiro li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--borda); }
.roteiro li:first-child { border-top: 0; }
.roteiro b { font-variant-numeric: lining-nums tabular-nums; color: var(--cr-laranja-escuro); }
.fac blockquote { margin: 0; font-family: var(--cr-fonte-titulo); font-weight: 500; font-size: 18px; line-height: 1.3; }
.fac-cuidado { padding: 14px 16px; border-radius: 14px; background: var(--cr-laranja-claro); }
.fac .btn { min-height: 46px; padding: 10px 20px; font-size: 13px; }
.fac .btn-sec:hover, .fac .btn-sec { color: var(--cr-espresso); border-color: var(--borda-forte); }
.fac .btn-sec:hover { border-color: var(--cr-laranja-claro); }
.fac-conf { padding: 16px; border: 1.5px solid var(--cr-espresso); border-radius: 14px; display: flex; flex-direction: column; gap: 12px; }

/* =====================================================================
   10. ACESSIBILIDADE: reduzir movimento
===================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const reduzMovimento = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function aleatorio(max) {               // inteiro seguro em [0, max)
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}
function embaralhar(lista) {            // Fisher–Yates
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = aleatorio(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sortear(n) {                   // retira n cartas do baralho: não repete na sessão

}

  raiz.classList.add('tela-saindo');

/* ---------- Rodadas (cartas) ---------- */
function iniciarRodada(n) {

function cartaAtual() { return estado.cartas[estado.indice]; }

function passosHTML(i, n) {

function mostrarCarta() {
  const n = estado.cartas.length, i = estado.indice + 1;

/* Desenha só a carta + rodapé (usado também ao virar para a inversa) */
function desenharCarta() {
  const c = cartaAtual();
  const wrap = $('#carta-wrap'), rodape = $('#rodape'), prox = $('#b-prox');
  const pendente = c.tipo === 'coringa' && !c.criada;
  const r1 = estado.rodada === 1;

  if (!estado.vistas.includes(c) && !pendente) estado.vistas.push(c);

  if (pendente) {
    wrap.innerHTML = cartaCoringaCriarHTML();
    rodape.innerHTML = `<span class="texto-p">${esc(TEXTOS.coringa.avisoCriar)}</span>`;
    prox.disabled = true;
    pararTempo();
    const campo = $('#campo-coringa'), criar = $('#b-criar');
    campo.addEventListener('input', () => { criar.disabled = !campo.value.trim(); });
    campo.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (campo.value.trim()) criar.click(); }
    });
    criar.onclick = () => {
      const txt = campo.value.trim().replace(/\s+/g, ' ');
      if (!txt) return;
      c.texto = txt; c.criada = true;
      desenharCarta();
    };
    setTimeout(() => campo.focus({ preventScroll: true }), 50);
    return;
  }

  prox.disabled = false;

  if (estado.inversa) {
    wrap.innerHTML = cartaInversaHTML();
    rodape.innerHTML = '';
    $('#b-voltar').onclick = () => { estado.inversa = false; desenharCarta(); };
    const art = $('[data-foco-carta]', wrap); if (art) art.focus({ preventScroll: true });
    return;
  }

  wrap.innerHTML = cartaHTML(c);
  const tempoHTML = r1
    ? `<button type="button" class="tempo" id="tempo" aria-label="${esc(TEXTOS.cartas.cronometroAjuda)}"><span class="tempo-n" id="tempo-n" aria-hidden="true">1:00</span><span class="tempo-trilho" aria-hidden="true"><span class="tempo-fill" id="tempo-fill"></span></span></button>`
    : '<span></span>';
  rodape.innerHTML = `${tempoHTML}<button type="button" class="btn-link" id="b-rapido">${esc(TEXTOS.cartas.terminamosRapido)}</button>`;
  $('#b-rapido').onclick = () => { estado.inversa = true; desenharCarta(); };
  if (r1) {
    $('#tempo').onclick = iniciarTempo;
    if (!tempoIniciou) iniciarTempo(); else atualizarTempo();   // não reinicia ao voltar da carta inversa
  }
  if (c.tipo === 'coringa') { const art = $('[data-foco-carta]', wrap); if (art) art.focus({ preventScroll: true }); }
}

function proximaCarta() {
  estado.inversa = false;
  if (estado.indice < estado.cartas.length - 1) {
    estado.indice++;
    mostrarCarta();
  } else if (estado.rodada === 1) {
    telaTroca();
  } else {
    telaPlenaria();
  }
}

/* ---------- Cronômetro discreto (60 s, sem som, não bloqueia nada) ---------- */
function iniciarTempo() {
  pararTempo();
  if (!$('#tempo-n')) return;
  tempoIniciou = true;
  tempoFim = Date.now() + SEGUNDOS_POR_CARTA * 1000;
  atualizarTempo();
  tempoInt = setInterval(atualizarTempo, 250);
}
function pararTempo() { if (tempoInt) { clearInterval(tempoInt); tempoInt = null; } }
function atualizarTempo() {
  const n = $('#tempo-n'), f = $('#tempo-fill');
  if (!n || !f) return;
  const resta = Math.max(0, tempoFim - Date.now());
  const s = Math.ceil(resta / 1000);
  n.textContent = `${Math.floor(s / 60)}:${pad2(s % 60)}`;
  f.style.transform = `scaleX(${resta / (SEGUNDOS_POR_CARTA * 1000)})`;
  if (resta <= 0) pararTempo();
}

  const t = TEXTOS.plenaria;
  estado.plenaria = { saco: [], atual: null };
  ir('plenaria', () => {
    const itens = t.opcoes.map((o, i) => `${i ? `<li class="ou">${esc(t.ou)}</li>` : ''}<li>${esc(o)}</li>`).join('');
    raiz.innerHTML = `
      <p class="eyebrow">${esc(t.rotulo)}</p>
      <h2 class="titulo-xl" data-foco>${esc(t.titulo)}</h2>
      <div><p class="texto" style="margin-bottom:10px">${esc(t.intro)}</p><ul class="opcoes">${itens}</ul></div>
      <div class="destaque"><span class="rotulo">${esc(t.rotuloOuro)}</span><p class="pergunta-destaque">“${esc(t.ouro)}”</p></div>
      <div id="plen-carta" class="plen-carta" aria-live="polite"></div>
      <div class="acoes">
        <button class="btn" id="b-ver" type="button">${esc(t.ver)}</button>
        <button class="btn btn-sec" id="b-outra" type="button" hidden>${esc(t.outra)}</button>
        <button class="btn-link" id="b-seguir" type="button">${esc(t.seguir)}</button>
      </div>`;
    colocarLinha('13', 'l-plenaria');
    $('#b-ver').onclick = () => { sortearPlenaria(); $('#b-ver').hidden = true; $('#b-outra').hidden = false; $('#b-outra').focus({ preventScroll: true }); };
    $('#b-outra').onclick = sortearPlenaria;
    $('#b-seguir').onclick = telaFechamento;
  });
}

/* Só sorteia entre as cartas que a dupla viu; só repete quando todas já apareceram */
function sortearPlenaria() {
  const p = estado.plenaria;
  if (!p.saco.length) p.saco = embaralhar(estado.vistas.filter(c => c !== p.atual));
  if (!p.saco.length) p.saco = estado.vistas.slice();
  p.atual = p.saco.pop();
  const box = $('#plen-carta');
  box.innerHTML = cartaHTML(p.atual, { semPergunta: true });
  box.scrollIntoView({ block: 'nearest', behavior: reduzMovimento() ? 'auto' : 'smooth' });
}

/* ---------- Fechamento ---------- */
function telaFechamento() {
  const t = TEXTOS.fechamento;
  ir('fechamento', () => {
    const cls = ['f1', 'f2', 'f3', 'f4'];
    raiz.innerHTML = `
      <div class="fecha" id="fecha" aria-live="polite">
        ${t.frases.map((f, i) => `<p class="${cls[i]}" hidden${i === 0 ? ' data-foco' : ''}>${esc(f)}</p>`).join('')}
      </div>
      <div class="acoes"><button class="btn" id="b-fim" type="button" hidden>${esc(t.botao)}</button></div>
      <p class="assina" id="assina" hidden>${esc(t.assinatura)}</p>`;
    colocarLinha('02', 'l-fecha');
    const ps = [...raiz.querySelectorAll('#fecha p')];
    const btn = $('#b-fim'), assina = $('#assina');
    const mostrar = (el) => { if (el.hidden) { el.hidden = false; if (!reduzMovimento()) el.classList.add('revela'); } };
    const tudo = () => { limparTimersSemTempo(); ps.forEach(mostrar); mostrar(btn); mostrar(assina); };
    if (reduzMovimento()) { tudo(); }
    else {
      [500, 2800, 4800, 7000].forEach((ms, i) => agendar(() => mostrar(ps[i]), ms));
      agendar(() => { mostrar(btn); mostrar(assina); }, 8800);
      $('#palco').addEventListener('click', e => { if (e.target.closest('button')) return; tudo(); }, { once: true });
    }
    btn.onclick = telaFim;
  });
}
function limparTimersSemTempo() { timers.forEach(clearTimeout); timers = []; }

/* ---------- Fim ---------- */
function telaFim() {
  const t = TEXTOS.fim;
  ir('fim', () => {
    raiz.innerHTML = `
      <h2 class="titulo-l" data-foco>${esc(t.pergunta)}</h2>
      <div class="acoes"><button class="btn btn-sec" id="b-voltar-ini" type="button">${esc(t.voltar)}</button></div>`;
    $('#b-voltar-ini').onclick = reiniciar;
  });
}

/* =====================================================================
   H. RESET COMPLETO
===================================================================== */
function reiniciar() {
  limparTimers();
  estado = novoEstado();
  fecharFacilitador();
  telaAbertura();
}

/* =====================================================================
   I. MODO FACILITADOR
===================================================================== */
const dlg = $('#painel');
const btnFac = $('#btn-fac');
btnFac.textContent = TEXTOS.facilitador.botao;

function facilitadorHTML() {
  const f = TEXTOS.facilitador;
  return `
    <div class="fac-topo">
      <div>
        <h2 id="painel-titulo">${esc(f.titulo)}</h2>
        <div class="fac-meta">${f.dinamica.map(d => `<span>${esc(d)}</span>`).join('')}</div>
      </div>
      <button type="button" class="btn-link" id="painel-fechar">${esc(f.fechar)}</button>
    </div>
    <section><h3>${esc(f.rotuloRoteiro)}</h3>
      <ul class="roteiro">${f.roteiro.map(([t, a]) => `<li><b>${esc(t)}</b><span>${esc(a)}</span></li>`).join('')}</ul>
    </section>
    <section><h3>${esc(f.rotuloCentral)}</h3><blockquote>“${esc(f.central)}”</blockquote></section>
    <section><h3>${esc(f.rotuloOuro)}</h3><blockquote>“${esc(f.ouro)}”</blockquote></section>
    <section class="fac-cuidado"><h3>${esc(f.rotuloCuidado)}</h3>
      <p>${esc(f.cuidado)}</p><blockquote style="margin-top:6px">“${esc(f.cuidadoFrase)}”</blockquote>
    </section>
    <div id="painel-reset"><button type="button" class="btn btn-sec" id="painel-reiniciar">${esc(f.reiniciar)}</button></div>`;
}

function abrirFacilitador() {
  $('#painel-conteudo').innerHTML = facilitadorHTML();
  $('#painel-fechar').onclick = fecharFacilitador;
  $('#painel-reiniciar').onclick = () => {
    const f = TEXTOS.facilitador;
    $('#painel-reset').innerHTML = `
      <div class="fac-conf" role="alertdialog" aria-labelledby="painel-conf-t">
        <p id="painel-conf-t">${esc(f.confirmaTexto)}</p>
        <div class="acoes">
          <button type="button" class="btn" id="painel-sim">${esc(f.confirmaSim)}</button>
          <button type="button" class="btn btn-sec" id="painel-nao">${esc(f.confirmaNao)}</button>
        </div>
      </div>`;
    $('#painel-sim').onclick = reiniciar;
    $('#painel-nao').onclick = () => { abrirFacilitador(); $('#painel-reiniciar').focus(); };
    $('#painel-nao').focus();
  };
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
}
function fecharFacilitador() {
  if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
}
btnFac.addEventListener('click', abrirFacilitador);
dlg.addEventListener('click', e => { if (e.target === dlg) fecharFacilitador(); });   // clique fora fecha
dlg.addEventListener('close', () => btnFac.focus({ preventScroll: true }));

/* =====================================================================
   J. INÍCIO
===================================================================== */
estado = novoEstado();
telaAbertura();

})();
</script>
</body>
</html>
